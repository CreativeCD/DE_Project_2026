<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="header-grad-city" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="header-grad-user" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="header-grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="header-grad-finance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="header-grad-ratings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="800" y="45" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="bold" letter-spacing="1">UBER RIDE-HAILING RELATIONAL SCHEMA (3NF / BCNF)</text>
  <text x="800" y="72" text-anchor="middle" fill="#94a3b8" font-size="14">Entity-Relationship Diagram with Data Types, Constraints &amp; Referential Actions</text>

  <!-- 1. CITIES (x: 50, y: 110, w: 260) -->
  <g transform="translate(50, 110)" filter="url(#shadow)">
    <rect width="260" height="225" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 252 0 Q 260 0 260 8 L 260 38 L 0 38 Z" fill="url(#header-grad-city)"/>
    <text x="130" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">CITIES</text>
    <text x="15" y="58" fill="#38bdf8" font-size="12" font-weight="bold">PK  city_id</text><text x="170" y="58" fill="#94a3b8" font-size="12">INT</text>
    <text x="15" y="82" fill="#f8fafc" font-size="12">UQ  city_name</text><text x="170" y="82" fill="#94a3b8" font-size="12">VARCHAR(50)</text>
    <text x="15" y="106" fill="#f8fafc" font-size="12">    state</text><text x="170" y="106" fill="#94a3b8" font-size="12">VARCHAR(50)</text>
    <text x="15" y="130" fill="#f8fafc" font-size="12">    base_fare</text><text x="170" y="130" fill="#94a3b8" font-size="12">NUMERIC(6,2)</text>
    <text x="15" y="154" fill="#f8fafc" font-size="12">    per_km_rate</text><text x="170" y="154" fill="#94a3b8" font-size="12">NUMERIC(6,2)</text>
    <text x="15" y="178" fill="#f8fafc" font-size="12">    per_min_rate</text><text x="170" y="178" fill="#94a3b8" font-size="12">NUMERIC(6,2)</text>
    <text x="15" y="202" fill="#f8fafc" font-size="12">    launched_on</text><text x="170" y="202" fill="#94a3b8" font-size="12">DATE</text>
  </g>

  <!-- 2. RIDERS (x: 50, y: 410, w: 270) -->
  <g transform="translate(50, 410)" filter="url(#shadow)">
    <rect width="270" height="250" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 38 L 0 38 Z" fill="url(#header-grad-user)"/>
    <text x="135" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">RIDERS</text>
    <text x="15" y="58" fill="#38bdf8" font-size="12" font-weight="bold">PK  rider_id</text><text x="170" y="58" fill="#94a3b8" font-size="12">INT</text>
    <text x="15" y="82" fill="#f8fafc" font-size="12">    full_name</text><text x="170" y="82" fill="#94a3b8" font-size="12">VARCHAR(100)</text>
    <text x="15" y="106" fill="#f8fafc" font-size="12">UQ  email</text><text x="170" y="106" fill="#94a3b8" font-size="12">VARCHAR(100)</text>
    <text x="15" y="130" fill="#f8fafc" font-size="12">UQ  phone</text><text x="170" y="130" fill="#94a3b8" font-size="12">VARCHAR(15)</text>
    <text x="15" y="154" fill="#f59e0b" font-size="12">FK  home_city_id</text><text x="170" y="154" fill="#94a3b8" font-size="12">INT</text>
    <text x="15" y="178" fill="#f8fafc" font-size="12">    signup_date</text><text x="170" y="178" fill="#94a3b8" font-size="12">DATE</text>
    <text x="15" y="202" fill="#f8fafc" font-size="12">    rider_rating</text><text x="170" y="202" fill="#94a3b8" font-size="12">NUMERIC(3,2)</text>
    <text x="15" y="226" fill="#f8fafc" font-size="12">    is_active</text><text x="170" y="226" fill="#94a3b8" font-size="12">BOOLEAN</text>
  </g>

  <!-- 3. DRIVERS (x: 420, y: 110, w: 270) -->
  <g transform="translate(420, 110)" filter="url(#shadow)">
    <rect width="270" height="250" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 38 L 0 38 Z" fill="url(#header-grad-user)"/>
    <text x="135" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">DRIVERS</text>
    <text x="15" y="58" fill="#38bdf8" font-size="12" font-weight="bold">PK  driver_id</text><text x="170" y="58" fill="#94a3b8" font-size="12">INT</text>
    <text x="15" y="82" fill="#f8fafc" font-size="12">    full_name</text><text x="170" y="82" fill="#94a3b8" font-size="12">VARCHAR(100)</text>
    <text x="15" y="106" fill="#f8fafc" font-size="12">UQ  phone</text><text x="170" y="106" fill="#94a3b8" font-size="12">VARCHAR(15)</text>
    <text x="15" y="130" fill="#f8fafc" font-size="12">UQ  license_no</text><text x="170" y="130" fill="#94a3b8" font-size="12">VARCHAR(25)</text>
    <text x="15" y="154" fill="#f59e0b" font-size="12">FK  city_id</text><text x="170" y="154" fill="#94a3b8" font-size="12">INT</text>
    <text x="15" y="178" fill="#f8fafc" font-size="12">    joined_on</text><text x="170" y="178" fill="#94a3b8" font-size="12">DATE</text>
    <text x="15" y="202" fill="#f8fafc" font-size="12">    driver_rating</text><text x="170" y="202" fill="#94a3b8" font-size="12">NUMERIC(3,2)</text>
    <text x="15" y="226" fill="#f8fafc" font-size="12">    status</text><text x="170" y="226" fill="#94a3b8" font-size="12">VARCHAR(20)</text>
  </g>

  <!-- 4. VEHICLES (x: 420, y: 440, w: 270) -->
  <g transform="translate(420, 440)" filter="url(#shadow)">
    <rect width="270" height="250" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 38 L 0 38 Z" fill="url(#header-grad-user)"/>
    <text x="135" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">VEHICLES</text>
    <text x="15" y="58" fill="#38bdf8" font-size="12" font-weight="bold">PK  vehicle_id</text><text x="170" y="58" fill="#94a3b8" font-size="12">INT</text>
    <text x="15" y="82" fill="#f59e0b" font-size="12">FK  driver_id</text><text x="170" y="82" fill="#94a3b8" font-size="12">INT</text>
    <text x="15" y="106" fill="#f8fafc" font-size="12">UQ  registration_no</text><text x="170" y="106" fill="#94a3b8" font-size="12">VARCHAR(15)</text>
    <text x="15" y="130" fill="#f8fafc" font-size="12">    make</text><text x="170" y="130" fill="#94a3b8" font-size="12">VARCHAR(50)</text>
    <text x="15" y="154" fill="#f8fafc" font-size="12">    model</text><text x="170" y="154" fill="#94a3b8" font-size="12">VARCHAR(50)</text>
    <text x="15" y="178" fill="#f8fafc" font-size="12">    manufacture_year</text><text x="170" y="178" fill="#94a3b8" font-size="12">INT</text>
    <text x="15" y="202" fill="#f8fafc" font-size="12">    vehicle_type</text><text x="170" y="202" fill="#94a3b8" font-size="12">VARCHAR(20)</text>
    <text x="15" y="226" fill="#f8fafc" font-size="12">    seat_capacity</text><text x="170" y="226" fill="#94a3b8" font-size="12">SMALLINT</text>
  </g>

  <!-- 5. PROMO_CODES (x: 50, y: 750, w: 270) -->
  <g transform="translate(50, 750)" filter="url(#shadow)">
    <rect width="270" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 38 L 0 38 Z" fill="url(#header-grad-finance)"/>
    <text x="135" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">PROMO_CODES</text>
    <text x="15" y="58" fill="#38bdf8" font-size="12" font-weight="bold">PK  promo_code</text><text x="170" y="58" fill="#94a3b8" font-size="12">VARCHAR(20)</text>
    <text x="15" y="82" fill="#f8fafc" font-size="12">    discount_pct</text><text x="170" y="82" fill="#94a3b8" font-size="12">INT</text>
    <text x="15" y="106" fill="#f8fafc" font-size="12">    max_discount</text><text x="170" y="106" fill="#94a3b8" font-size="12">NUMERIC(8,2)</text>
    <text x="15" y="130" fill="#f8fafc" font-size="12">    valid_from</text><text x="170" y="130" fill="#94a3b8" font-size="12">DATE</text>
    <text x="15" y="154" fill="#f8fafc" font-size="12">    valid_to</text><text x="170" y="154" fill="#94a3b8" font-size="12">DATE</text>
    <text x="15" y="178" fill="#f8fafc" font-size="12">    is_active</text><text x="170" y="178" fill="#94a3b8" font-size="12">BOOLEAN</text>
  </g>

  <!-- 6. TRIPS (x: 820, y: 110, w: 340) -->
  <g transform="translate(820, 110)" filter="url(#shadow)">
    <rect width="340" height="520" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 332 0 Q 340 0 340 8 L 340 38 L 0 38 Z" fill="url(#header-grad-core)"/>
    <text x="170" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">TRIPS</text>
    <text x="15" y="58" fill="#38bdf8" font-size="12" font-weight="bold">PK  trip_id</text><text x="210" y="58" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="82" fill="#f59e0b" font-size="12">FK  rider_id</text><text x="210" y="82" fill="#94a3b8" font-size="12">INT</text>
    <text x="15" y="106" fill="#f59e0b" font-size="12">FK  driver_id (nullable)</text><text x="210" y="106" fill="#94a3b8" font-size="12">INT</text>
    <text x="15" y="130" fill="#f59e0b" font-size="12">FK  vehicle_id (nullable)</text><text x="210" y="130" fill="#94a3b8" font-size="12">INT</text>
    <text x="15" y="154" fill="#f59e0b" font-size="12">FK  city_id</text><text x="210" y="154" fill="#94a3b8" font-size="12">INT</text>
    <text x="15" y="178" fill="#f59e0b" font-size="12">FK  promo_code (nullable)</text><text x="210" y="178" fill="#94a3b8" font-size="12">VARCHAR(20)</text>
    <text x="15" y="202" fill="#f8fafc" font-size="12">    requested_at</text><text x="210" y="202" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
    <text x="15" y="226" fill="#f8fafc" font-size="12">    pickup_at (nullable)</text><text x="210" y="226" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
    <text x="15" y="250" fill="#f8fafc" font-size="12">    dropoff_at (nullable)</text><text x="210" y="250" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
    <text x="15" y="274" fill="#f8fafc" font-size="12">    pickup_lat</text><text x="210" y="274" fill="#94a3b8" font-size="12">NUMERIC(9,6)</text>
    <text x="15" y="298" fill="#f8fafc" font-size="12">    pickup_lng</text><text x="210" y="298" fill="#94a3b8" font-size="12">NUMERIC(9,6)</text>
    <text x="15" y="322" fill="#f8fafc" font-size="12">    drop_lat</text><text x="210" y="322" fill="#94a3b8" font-size="12">NUMERIC(9,6)</text>
    <text x="15" y="346" fill="#f8fafc" font-size="12">    drop_lng</text><text x="210" y="346" fill="#94a3b8" font-size="12">NUMERIC(9,6)</text>
    <text x="15" y="370" fill="#f8fafc" font-size="12">    distance_km (nullable)</text><text x="210" y="370" fill="#94a3b8" font-size="12">NUMERIC(6,2)</text>
    <text x="15" y="394" fill="#f8fafc" font-size="12">    duration_min (nullable)</text><text x="210" y="394" fill="#94a3b8" font-size="12">INT</text>
    <text x="15" y="418" fill="#f8fafc" font-size="12">    surge_multiplier</text><text x="210" y="418" fill="#94a3b8" font-size="12">NUMERIC(4,2)</text>
    <text x="15" y="442" fill="#f8fafc" font-size="12">    fare_amount (nullable)</text><text x="210" y="442" fill="#94a3b8" font-size="12">NUMERIC(8,2)</text>
    <text x="15" y="466" fill="#f8fafc" font-size="12">    status</text><text x="210" y="466" fill="#94a3b8" font-size="12">VARCHAR(25)</text>
  </g>

  <!-- 7. PAYMENTS (x: 1270, y: 110, w: 280) -->
  <g transform="translate(1270, 110)" filter="url(#shadow)">
    <rect width="280" height="205" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 38 L 0 38 Z" fill="url(#header-grad-finance)"/>
    <text x="140" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">PAYMENTS</text>
    <text x="15" y="58" fill="#38bdf8" font-size="12" font-weight="bold">PK     payment_id</text><text x="180" y="58" fill="#94a3b8" font-size="12">INT</text>
    <text x="15" y="82" fill="#f59e0b" font-size="12">FK, UQ trip_id</text><text x="180" y="82" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="106" fill="#f8fafc" font-size="12">       amount</text><text x="180" y="106" fill="#94a3b8" font-size="12">NUMERIC(8,2)</text>
    <text x="15" y="130" fill="#f8fafc" font-size="12">       method</text><text x="180" y="130" fill="#94a3b8" font-size="12">VARCHAR(20)</text>
    <text x="15" y="154" fill="#f8fafc" font-size="12">       payment_status</text><text x="180" y="154" fill="#94a3b8" font-size="12">VARCHAR(20)</text>
    <text x="15" y="178" fill="#f8fafc" font-size="12">       paid_at</text><text x="180" y="178" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
  </g>

  <!-- 8. RATINGS (x: 1270, y: 400, w: 280) -->
  <g transform="translate(1270, 400)" filter="url(#shadow)">
    <rect width="280" height="180" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 38 L 0 38 Z" fill="url(#header-grad-ratings)"/>
    <text x="140" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">RATINGS</text>
    <text x="15" y="58" fill="#38bdf8" font-size="12" font-weight="bold">PK, FK trip_id</text><text x="180" y="58" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="82" fill="#38bdf8" font-size="12" font-weight="bold">PK     rated_by</text><text x="180" y="82" fill="#94a3b8" font-size="12">VARCHAR(10)</text>
    <text x="15" y="106" fill="#f8fafc" font-size="12">       stars</text><text x="180" y="106" fill="#94a3b8" font-size="12">SMALLINT</text>
    <text x="15" y="130" fill="#f8fafc" font-size="12">       comment</text><text x="180" y="130" fill="#94a3b8" font-size="12">VARCHAR(255)</text>
    <text x="15" y="154" fill="#f8fafc" font-size="12">       created_at</text><text x="180" y="154" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
  </g>

  <!-- RELATIONSHIP CONNECTORS & LABELS -->
  <!-- CITIES to RIDERS -->
  <path d="M 180 335 L 180 410" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <text x="190" y="375" fill="#38bdf8" font-size="11">1 : N</text>

  <!-- CITIES to DRIVERS -->
  <path d="M 310 200 L 420 200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <text x="350" y="190" fill="#38bdf8" font-size="11">1 : N</text>

  <!-- DRIVERS to VEHICLES -->
  <path d="M 555 360 L 555 440" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <text x="565" y="405" fill="#38bdf8" font-size="11">1 : N</text>

  <!-- RIDERS to TRIPS -->
  <path d="M 320 535 L 820 190" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-dasharray="4,3"/>
  <text x="550" y="450" fill="#60a5fa" font-size="11">1 : N (requests)</text>

  <!-- DRIVERS to TRIPS -->
  <path d="M 690 230 L 820 215" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <text x="730" y="210" fill="#60a5fa" font-size="11">1 : N (drives)</text>

  <!-- VEHICLES to TRIPS -->
  <path d="M 690 565 L 820 240" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-dasharray="4,3"/>
  <text x="710" y="370" fill="#60a5fa" font-size="11">1 : N (used in)</text>

  <!-- CITIES to TRIPS -->
  <path d="M 200 110 Q 200 90 400 90 L 800 90 Q 820 90 820 265" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-dasharray="6,4"/>
  <text x="500" y="82" fill="#38bdf8" font-size="11">1 : N (takes place in)</text>

  <!-- PROMO_CODES to TRIPS -->
  <path d="M 320 850 Q 820 850 820 290" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-dasharray="4,3"/>
  <text x="600" y="840" fill="#f59e0b" font-size="11">1 : N (applied to 0..N)</text>

  <!-- TRIPS to PAYMENTS -->
  <path d="M 1160 210 L 1270 210" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <text x="1190" y="198" fill="#10b981" font-size="11">1 : 1 (UNIQUE)</text>

  <!-- TRIPS to RATINGS -->
  <path d="M 1160 300 Q 1215 300 1215 490 L 1270 490" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <text x="1180" y="410" fill="#a855f7" font-size="11">1 : N (0..2 ratings)</text>

  <!-- LEGEND -->
  <g transform="translate(50, 1020)">
    <rect width="1500" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" fill="#f8fafc" font-size="13" font-weight="bold">Schema Legend &amp; Rules:</text>
    <text x="20" y="54" fill="#38bdf8" font-size="12">PK = Primary Key</text>
    <text x="160" y="54" fill="#f59e0b" font-size="12">FK = Foreign Key (ON DELETE RESTRICT unless noted)</text>
    <text x="540" y="54" fill="#94a3b8" font-size="12">UQ = UNIQUE candidate key</text>
    <text x="730" y="54" fill="#10b981" font-size="12">Solid line = Mandatory FK / 1:1</text>
    <text x="950" y="54" fill="#60a5fa" font-size="12">Dashed line = Nullable FK / Optional relationship</text>
    <text x="1280" y="54" fill="#a855f7" font-size="12">Composite PK = (trip_id, rated_by)</text>
  </g>
</svg>